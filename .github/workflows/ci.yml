name: yara-rule-draft-review
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ github.workspace }}/Build/源码
    env:
      TMPDIR: ${{ github.workspace }}/Build/临时
      TMP: ${{ github.workspace }}/Build/临时
      TEMP: ${{ github.workspace }}/Build/临时
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/Build/缓存/python
      PIP_CACHE_DIR: ${{ github.workspace }}/Build/缓存/pip
      npm_config_cache: ${{ github.workspace }}/Build/缓存/npm
      RUFF_CACHE_DIR: ${{ github.workspace }}/Build/缓存/ruff
      GOCACHE: ${{ github.workspace }}/Build/缓存/go
      GOMODCACHE: ${{ github.workspace }}/Build/缓存/go-mod
      GOTMPDIR: ${{ github.workspace }}/Build/临时
      GOPATH: ${{ github.workspace }}/Build/缓存/go-path
      GOBIN: ${{ github.workspace }}/Build/输出/go-bin
      CARGO_HOME: ${{ github.workspace }}/Build/缓存/cargo
      XDG_CACHE_HOME: ${{ github.workspace }}/Build/缓存/xdg
      CCACHE_DIR: ${{ github.workspace }}/Build/缓存/ccache
      SCCACHE_DIR: ${{ github.workspace }}/Build/缓存/sccache
      NODE_COMPILE_CACHE: ${{ github.workspace }}/Build/缓存/node
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Stage source and restored project inputs under Build
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} 构建.py --stage --ci
        working-directory: ${{ github.workspace }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Source tests, actual native compiler matrix and build
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip download --no-deps --no-binary :all: yara-python==4.5.4 -d validation-local/reference
          python scripts/verify_dependency_notices.py validation-local/reference/yara_python-4.5.4.tar.gz
          PYTHONPATH=src python -m unittest discover -s tests -v
          PYTHONPATH=src python scripts/native_matrix_check.py
          ruff check src tests scripts
          ruff format --check src tests scripts
          python -m build --no-isolation
      - name: Fresh independent wheel consumer, full tests and installed CLI
        run: |
          python -m venv validation-local/consumer
          validation-local/consumer/bin/python -m pip install dist/yara_rule_draft_review-0.1.3-py3-none-any.whl
          validation-local/consumer/bin/python -m pip check
          consumer_python="$PWD/validation-local/consumer/bin/python"
          repo_root="$PWD"
          cd "$TMPDIR"
          "$consumer_python" -I -m unittest discover -s "$repo_root/tests" -v
          "$consumer_python" -I "$repo_root/scripts/native_matrix_check.py"
          "$consumer_python" -I "$repo_root/scripts/installed_cli_check.py"
          installed_dir=$("$consumer_python" -I -c 'import pathlib,yara_rule_draft_review; print(pathlib.Path(yara_rule_draft_review.__file__).parent.parent)')
          "$consumer_python" -I "$repo_root/scripts/verify_package.py" "$repo_root" --installed "$installed_dir"

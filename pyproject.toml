[build-system]
requires = ["setuptools==82.0.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yara-rule-draft-review"
version = "0.1.2"
description = "Bounded offline goodware difference and actually compiled literal YARA detection drafts"
readme = "项目文档/README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["项目文档/LICENSE", "项目文档/NOTICE"]
authors = [{name = "dhtfish98"}]
dependencies = ["yara-python==4.5.4"]

[project.scripts]
yara-rule-draft-review = "yara_rule_draft_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yara_rule_draft_review = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
